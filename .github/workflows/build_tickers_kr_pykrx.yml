name: 국장 티커 한글명 수집 (pykrx)

on:
  workflow_dispatch:

jobs:
  build_tickers_kr_pykrx:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install pandas pykrx

      - name: 티커 수집
        run: python build_tickers_kr_pykrx.py

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers_kr.csv
          git diff --staged --quiet || git commit -m "국장 티커 한글명 업데이트 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push